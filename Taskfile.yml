---
version: "3"

tasks:
  dev:
    desc: Start VitePress dev server with hot reload
    cmd: npm run dev
    dir: docs

  build:
    desc: Build the static site into docs/.vitepress/dist
    cmd: npm run build
    dir: docs

  preview:
    desc: Serve the production build locally
    cmd: npm run preview
    dir: docs

  install:
    desc: Install dependencies (inside docs/)
    cmd: npm install
    dir: docs

  generate:
    desc: Regenerate docs/.vitepress/types/adl.ts from the upstream ADL JSON Schema
    cmd: npm run codegen
    dir: docs

  lint:
    desc: Run markdownlint (same check CI runs)
    cmd: markdownlint --ignore '**/node_modules/**' --ignore '**/.vitepress/cache/**' --ignore '**/.vitepress/dist/**' --ignore AGENTS.md --ignore CLAUDE.md --ignore CHANGELOG.md .

  lint:fix:
    desc: Run markdownlint with auto-fix
    cmd: markdownlint --ignore '**/node_modules/**' --ignore '**/.vitepress/cache/**' --ignore '**/.vitepress/dist/**' --ignore AGENTS.md --ignore CLAUDE.md --ignore CHANGELOG.md --fix .

  format:
    desc: Format the repo with Prettier
    cmd: prettier --write .

  format:check:
    desc: Check formatting (same check CI runs)
    cmd: prettier --check .

  default:
    desc: Show available tasks
    cmd: task --list
