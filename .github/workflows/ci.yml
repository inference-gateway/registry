---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  codegen-fresh:
    name: ADL types up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate ADL types
        run: npm run codegen

      - name: Fail if src/types/adl.ts drifted from upstream ADL schema
        run: |
          if ! git diff --exit-code src/types/adl.ts; then
            echo "::error::src/types/adl.ts is out of sync with the upstream ADL JSON Schema."
            echo "::error::Run 'npm run codegen' locally and commit the result."
            exit 1
          fi
