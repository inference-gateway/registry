---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: "docs/package.json"
          cache: "npm"
          cache-dependency-path: "docs/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: "docs/package.json"

      - name: Check formatting with Prettier
        run: npx --yes prettier@3.8.3 --check .

  lint:
    name: Lint markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: "docs/package.json"

      - name: Run markdownlint
        run: npx --yes markdownlint-cli@0.48.0 --ignore '**/node_modules/**' --ignore '**/.vitepress/cache/**' --ignore '**/.vitepress/dist/**' --ignore AGENTS.md --ignore CLAUDE.md --ignore CHANGELOG.md .

  codegen-fresh:
    name: ADL types up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: "docs/package.json"
          cache: "npm"
          cache-dependency-path: "docs/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Regenerate ADL types
        run: npm run codegen
        working-directory: docs

      - name: Fail if docs/.vitepress/types/adl.ts drifted from upstream ADL schema
        run: |
          if ! git diff --exit-code docs/.vitepress/types/adl.ts; then
            echo "::error::docs/.vitepress/types/adl.ts is out of sync with the upstream ADL JSON Schema."
            echo "::error::Run 'npm run codegen' inside docs/ and commit the result."
            exit 1
          fi
