---
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Check formatting with Prettier
        run: bun x prettier@3.8.3 --check .

  lint:
    name: Lint markdown
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Run markdownlint
        run: bun x markdownlint-cli@0.48.0 --ignore '**/node_modules/**' --ignore '**/.vitepress/cache/**' --ignore '**/.vitepress/dist/**' --ignore AGENTS.md --ignore CLAUDE.md --ignore CHANGELOG.md .

  codegen-fresh:
    name: ADL types up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate ADL types
        run: bun run codegen

      - name: Fail if .vitepress/types/adl.ts drifted from upstream ADL schema
        run: |
          if ! git diff --exit-code .vitepress/types/adl.ts; then
            echo "::error::.vitepress/types/adl.ts is out of sync with the upstream ADL JSON Schema."
            echo "::error::Run 'bun run codegen' and commit the result."
            exit 1
          fi
